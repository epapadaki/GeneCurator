[project]
name = "genecurator"
version = "1.0.0"
description = "GeneCurator: Human-in-the-Loop Gene Selector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "shap>=0.44.0",
    "plotly>=5.18.0",
    "networkx>=3.0",
    "graphviz>=0.20.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
