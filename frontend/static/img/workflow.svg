<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="workflow-title">
  <title id="workflow-title">GeneCurator workflow diagram</title>

  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#556275"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3b6"/>
    </marker>

    <style>
      .box {
        fill: #ffffff;
        stroke: #cbd2dc;
        stroke-width: 1.2;
      }
      .box-highlight {
        fill: #f6f7f9;
        stroke: #4a5a70;
        stroke-width: 1.4;
      }
      .step-num {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 11px;
        letter-spacing: 0.1em;
        fill: #6a7688;
        font-weight: 400;
      }
      .step-title {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 15px;
        fill: #1f2937;
        font-weight: 500;
      }
      .step-desc {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 11px;
        fill: #556275;
      }
      .flow-line {
        stroke: #556275;
        stroke-width: 1.4;
        fill: none;
      }
      .flow-back {
        stroke: #98a3b6;
        stroke-width: 1.1;
        fill: none;
        stroke-dasharray: 4 3;
      }
      .agent-box {
        fill: #f0f4fa;
        stroke: #6b7a92;
        stroke-width: 1;
      }
      .agent-label {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 10px;
        fill: #4a5a70;
        font-style: italic;
      }
      .caption {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 10px;
        fill: #6a7688;
      }
    </style>
  </defs>

  <!-- Main pipeline: 4 steps in a row -->

  <!-- Step 1 -->
  <g transform="translate(30, 90)">
    <rect class="box" x="0" y="0" width="180" height="120" rx="4"/>
    <text class="step-num" x="90" y="22" text-anchor="middle">STEP 1</text>
    <text class="step-title" x="90" y="46" text-anchor="middle">Data input</text>
    <line x1="20" y1="58" x2="160" y2="58" stroke="#e5e7ec" stroke-width="1"/>
    <text class="step-desc" x="90" y="76" text-anchor="middle">Differential expression</text>
    <text class="step-desc" x="90" y="90" text-anchor="middle">table with gene ID,</text>
    <text class="step-desc" x="90" y="104" text-anchor="middle">p-value, log2 fold change</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(240, 90)">
    <rect class="box" x="0" y="0" width="180" height="120" rx="4"/>
    <text class="step-num" x="90" y="22" text-anchor="middle">STEP 2</text>
    <text class="step-title" x="90" y="46" text-anchor="middle">Feature selection</text>
    <line x1="20" y1="58" x2="160" y2="58" stroke="#e5e7ec" stroke-width="1"/>
    <text class="step-desc" x="90" y="76" text-anchor="middle">Six algorithms proposing</text>
    <text class="step-desc" x="90" y="90" text-anchor="middle">candidate gene panels</text>
    <text class="step-desc" x="90" y="104" text-anchor="middle">by importance ranking</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(450, 90)">
    <rect class="box-highlight" x="0" y="0" width="180" height="120" rx="4"/>
    <text class="step-num" x="90" y="22" text-anchor="middle">STEP 3</text>
    <text class="step-title" x="90" y="46" text-anchor="middle">Expert curation</text>
    <line x1="20" y1="58" x2="160" y2="58" stroke="#a3adbb" stroke-width="1"/>
    <text class="step-desc" x="90" y="76" text-anchor="middle">Human-in-the-loop</text>
    <text class="step-desc" x="90" y="90" text-anchor="middle">inclusion or exclusion</text>
    <text class="step-desc" x="90" y="104" text-anchor="middle">with per-gene evidence</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(660, 90)">
    <rect class="box" x="0" y="0" width="200" height="120" rx="4"/>
    <text class="step-num" x="100" y="22" text-anchor="middle">STEP 4</text>
    <text class="step-title" x="100" y="46" text-anchor="middle">Downstream analysis</text>
    <line x1="20" y1="58" x2="180" y2="58" stroke="#e5e7ec" stroke-width="1"/>
    <text class="step-desc" x="100" y="76" text-anchor="middle">Enrichment, PPI network,</text>
    <text class="step-desc" x="100" y="90" text-anchor="middle">ligand–receptor annotation,</text>
    <text class="step-desc" x="100" y="104" text-anchor="middle">expression profile</text>
  </g>

  <!-- Forward arrows between steps -->
  <line class="flow-line" x1="212" y1="150" x2="238" y2="150" marker-end="url(#arrow)"/>
  <line class="flow-line" x1="422" y1="150" x2="448" y2="150" marker-end="url(#arrow)"/>
  <line class="flow-line" x1="632" y1="150" x2="658" y2="150" marker-end="url(#arrow)"/>

  <!-- Back-loop from Step 3 → Step 2 (iteration) -->
  <path class="flow-back" d="M 450 90 Q 400 40, 340 90" marker-end="url(#arrow-back)"/>
  <text class="agent-label" x="395" y="40" text-anchor="middle">reselect</text>

  <!-- Agent & LR annotations, positioned below Step 3 -->
  <!-- Agent -->
  <g transform="translate(450, 240)">
    <rect class="agent-box" x="0" y="0" width="180" height="52" rx="4"/>
    <text x="90" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a5a70" font-weight="500">
      LLM curation assistant
    </text>
    <text x="90" y="38" text-anchor="middle" class="agent-label">
      Gemini 2.5 Flash · optional
    </text>
  </g>
  <line class="flow-back" x1="540" y1="212" x2="540" y2="238" marker-end="url(#arrow-back)"/>

  <!-- LR annotation -->
  <g transform="translate(660, 240)">
    <rect class="agent-box" x="0" y="0" width="200" height="52" rx="4"/>
    <text x="100" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a5a70" font-weight="500">
      Ligand–receptor annotation
    </text>
    <text x="100" y="38" text-anchor="middle" class="agent-label">
      CellTalkDB, 3,398 pairs
    </text>
  </g>
  <line class="flow-back" x1="760" y1="212" x2="760" y2="238"/>

  <!-- Enrichment note -->
  <g transform="translate(660, 306)">
    <text x="100" y="14" text-anchor="middle" class="agent-label">
      Enrichr: 15 libraries across
    </text>
    <text x="100" y="28" text-anchor="middle" class="agent-label">
      pathways, diseases, drugs
    </text>
  </g>

  <!-- Header -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1f2937" font-weight="500">
    Figure 1. GeneCurator analytical workflow.
  </text>

  <!-- Caption -->
  <text x="450" y="360" text-anchor="middle" class="caption">
    The pipeline advances from raw differential expression data through algorithmic ranking to expert refinement and downstream annotation.
  </text>
  <text x="450" y="373" text-anchor="middle" class="caption">
    The dashed arrow denotes optional iteration; auxiliary modules (dashed frames) support the curation and results stages.
  </text>
</svg>
