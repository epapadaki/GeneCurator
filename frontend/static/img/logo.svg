<!--
GeneCurator logo — a "GC" monogram with a subtle DNA-strand crossbar.
Two intersecting nucleotide-like arcs form the letter G's crossbar,
gesturing at gene curation without being cartoonish. Rendered in the
brand's Ionian navy, with a coral accent on the crossbar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Rounded square background in Ionian navy -->
  <rect x="0" y="0" width="40" height="40" rx="8" ry="8" fill="#0369a1"/>

  <!-- Letter G outline (open, mono-weight) -->
  <path d="M 20 8
           A 12 12 0 1 0 32 20
           L 20 20"
        stroke="#ffffff" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- DNA crossbar: two small coral-colored arcs suggesting a nucleotide
       pair on the G's horizontal stroke. Subtle, professional. -->
  <path d="M 22 20 Q 26 18 30 20" stroke="#ea580c" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
  <path d="M 22 20 Q 26 22 30 20" stroke="#ea580c" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>

  <!-- Two small dots as base pairs -->
  <circle cx="25" cy="19" r="1.1" fill="#ffffff"/>
  <circle cx="27" cy="21" r="1.1" fill="#ffffff"/>
</svg>
